name: 采集开源项目候选

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

concurrency:
  group: worklens-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 采集 GitHub 仓库元数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_github.py
      - name: 采集并合并公开资讯源
        run: python3 scripts/collect_public_feeds.py
      - name: 同步 Skill 待审队列（只入队，不流转、不安装）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/skill_review.py sync
      - name: 提交数据变化
        run: |
          if git diff --quiet -- data/discoveries.json data/skill-review-queue.json data/ai-news.json; then
            echo '没有新的数据变化'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/discoveries.json data/skill-review-queue.json data/ai-news.json
          git commit -m '数据：更新开源项目候选与 AI 资讯'
          git push
