name: 质量与安全门禁

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 单元测试
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: 前端适配器语法检查
        run: |
          node --check worklens_zn3k/v3/data-adapter.js
          node --check worklens_zn3k/v4/atelier-model.js
          node --check worklens_zn3k/v4/review-model.js
          node --check worklens-mobile_8a6r/v2/data-adapter.js
      - name: 前端只读视图模型契约测试
        run: node --test tests/*.js
      - name: 核心开源者圈层契约校验
        run: python3 scripts/core_circle.py
      - name: Skill 待审队列契约校验
        run: python3 scripts/skill_review.py validate
      - name: Idea 项目化流程契约校验
        run: python3 scripts/idea_pipeline.py validate
      - name: 推荐复盘契约校验
        run: python3 scripts/recommendation_review.py validate
      - name: 敏感信息扫描
        run: python3 scripts/security_scan.py
